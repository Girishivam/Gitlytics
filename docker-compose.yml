services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gitlytics
      POSTGRES_USER: gitlytics
      POSTGRES_PASSWORD: gitlytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitlytics -d gitlytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://gitlytics:gitlytics@db:5432/gitlytics
      FLASK_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
